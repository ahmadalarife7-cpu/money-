<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  :root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}
  img{max-width:100%}
  [hidden]:not([hidden=until-found i]){display:none!important}
</style>
</head>
<body>
<title>صندوق المال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f1f0ec;
    --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
    --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
    --primary:#2a78d6; --primary-ink:#ffffff; --primary-wash:#e8f0fc;
    --good:#0ca30c; --critical:#d03b3b; --critical-wash:#fbe9e9; --warning:#fab219;
    --cat-emergency:#2a78d6; --cat-goals:#eb6834; --cat-stocks:#1baf7a;
    --cat-gold:#eda100; --cat-luxury:#e87ba4; --cat-owed:#008300; --cat-iowe:#d03b3b;
    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(11,11,11,.05), 0 6px 18px rgba(11,11,11,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
      --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#918f89;
      --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
      --primary:#3987e5; --primary-ink:#ffffff; --primary-wash:#173154;
      --good:#0ca30c; --critical:#e66767; --critical-wash:#3a1a18; --warning:#c98500;
      --cat-emergency:#3987e5; --cat-goals:#d95926; --cat-stocks:#199e70;
      --cat-gold:#c98500; --cat-luxury:#d55181; --cat-owed:#008300; --cat-iowe:#e66767;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#918f89;
    --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
    --primary:#3987e5; --primary-ink:#ffffff; --primary-wash:#173154;
    --good:#0ca30c; --critical:#e66767; --critical-wash:#3a1a18; --warning:#c98500;
    --cat-emergency:#3987e5; --cat-goals:#d95926; --cat-stocks:#199e70;
    --cat-gold:#c98500; --cat-luxury:#d55181; --cat-owed:#008300; --cat-iowe:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:'Tajawal', system-ui, sans-serif; direction:rtl;
    -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:760px; margin:0 auto; padding:0 16px 64px; min-height:100vh; }

  header.top{ position:sticky; top:0; z-index:20; background:var(--page); padding:16px 0 8px; }
  header.top h1{ font-size:19px; font-weight:900; margin:0 0 2px; }
  header.top .sub{ font-size:12.5px; color:var(--ink-muted); }

  nav.tabs{ position:sticky; top:52px; z-index:19; background:var(--page);
    display:flex; gap:6px; overflow-x:auto; padding:10px 0 10px; margin-bottom:4px;
    scrollbar-width:none; }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{ flex:0 0 auto; border:1px solid var(--border); background:var(--surface);
    color:var(--ink-2); font-family:inherit; font-size:13px; font-weight:700;
    padding:8px 14px; border-radius:999px; cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:6px; transition:background .15s,color .15s,border-color .15s; }
  nav.tabs button.active{ background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }
  nav.tabs button .dot{ width:8px; height:8px; border-radius:50%; background:var(--dot,var(--ink-muted)); }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
  .card h2{ font-size:15px; margin:0 0 12px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .card h2 .ic{ font-size:16px; }
  .card .hint{ font-size:12px; color:var(--ink-muted); margin-top:-6px; margin-bottom:12px; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  @media (max-width:480px){ .grid3{ grid-template-columns:1fr 1fr; } }

  label{ display:block; font-size:12px; color:var(--ink-2); margin-bottom:4px; font-weight:600; }
  .field{ margin-bottom:10px; }
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; font-family:inherit; font-size:14px; padding:9px 10px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink); direction:rtl;
  }
  input:focus, select:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  input[type=number], input[inputmode=decimal], input[type=date]{ direction:ltr; text-align:right; }
  input[type=checkbox]{ width:20px; height:20px; accent-color:var(--primary); vertical-align:middle; }
  .chk-wrap{ display:flex; align-items:center; justify-content:center; width:40px; height:40px; margin:-10px; flex:0 0 auto; cursor:pointer; }

  button.btn{ font-family:inherit; font-weight:800; font-size:13.5px; border:none; cursor:pointer;
    padding:10px 16px; border-radius:var(--radius-sm); transition:opacity .15s, transform .05s; }
  button.btn:active{ transform:scale(.98); }
  button.btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--primary); color:var(--primary-ink); }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); border:1px solid var(--border) !important; }
  .btn-danger{ background:var(--critical-wash); color:var(--critical); }
  .btn-danger.armed{ background:var(--critical); color:#fff; }
  .btn-sm{ padding:7px 12px; font-size:12.5px; }
  .row-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  .stat{ text-align:center; padding:14px 8px; border-radius:var(--radius-sm); background:var(--surface-2); }
  .stat .v{ font-size:22px; font-weight:900; font-variant-numeric:tabular-nums; }
  .stat .l{ font-size:11.5px; color:var(--ink-muted); margin-top:2px; }
  .stat.good .v{ color:var(--good); }
  .stat.bad .v{ color:var(--critical); }

  .needs-item{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--grid); }
  .needs-item:last-child{ border-bottom:none; }
  .needs-item input[type=text]{ flex:1; }
  .needs-item input[type=number], .needs-item input[inputmode=decimal]{ width:100px; }
  .needs-item input::placeholder{ color:var(--ink-muted); opacity:0.65; }
  .x{ background:none; border:none; color:var(--ink-muted); font-size:16px; cursor:pointer;
    min-width:36px; min-height:36px; display:inline-flex; align-items:center; justify-content:center; padding:0; flex:0 0 auto; }

  .alloc-row{ display:grid; grid-template-columns:20px 1fr 100px; gap:8px; align-items:center; padding:6px 0; }
  .alloc-row .swatch{ width:12px; height:12px; border-radius:3px; background:var(--c); justify-self:center; }
  .alloc-row .nm{ font-size:13.5px; font-weight:700; }
  .alloc-person{ grid-column:2 / span 2; margin-top:-2px; }

  .name-suggest{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .name-suggest .lbl{ font-size:11.5px; color:var(--ink-muted); width:100%; }
  .name-chip{ border:1px solid var(--grid); background:var(--surface-2); color:var(--ink); border-radius:999px;
    padding:5px 13px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .name-chip:active, .name-chip.is-active{ background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }
  .alloc-summary{ display:flex; justify-content:space-between; font-size:13px; margin-top:10px; padding-top:10px; border-top:1px solid var(--grid); }
  .alloc-summary b{ font-variant-numeric:tabular-nums; }
  .alloc-summary.over b{ color:var(--critical); }

  table.log{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.log th{ text-align:right; color:var(--ink-muted); font-weight:700; padding:6px 6px; border-bottom:1px solid var(--grid); }
  table.log td{ padding:7px 6px; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums; }
  table.log tr:last-child td{ border-bottom:none; }
  .empty{ color:var(--ink-muted); font-size:13px; text-align:center; padding:16px 0; }

  .badge{ display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; }
  .badge.in{ background:var(--critical-wash); color:var(--critical); }
  .badge.out{ background:#e6f6ee; color:var(--good); }
  :root:not([data-theme="light"]) .badge.out{ background:#123526; }
  :root[data-theme="dark"] .badge.out{ background:#123526; }

  .person-card{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:8px; background:var(--surface-2); cursor:pointer; }
  .person-card .ph{ display:flex; justify-content:space-between; align-items:center; }
  .person-card .pname{ font-weight:800; font-size:14px; }
  .person-card .pbal{ font-weight:900; font-variant-numeric:tabular-nums; }
  .person-card .pmeta{ font-size:11.5px; color:var(--ink-muted); margin-top:2px; }
  .person-detail{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--grid); }

  .legend{ display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:12px; justify-content:center; }
  .legend .li{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2); }
  .legend .sw{ width:10px; height:10px; border-radius:3px; }

  .toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--page);
    padding:10px 18px; border-radius:999px; font-size:13px; font-weight:700; z-index:100; opacity:0; pointer-events:none;
    transition:opacity .2s, bottom .2s; }
  .toast.show{ opacity:1; bottom:26px; }

  .section-note{ font-size:11.5px; color:var(--ink-muted); background:var(--surface-2); border-radius:var(--radius-sm); padding:8px 10px; margin-bottom:10px; }

  #login-gate{ max-width:360px; margin:64px auto; padding:26px 24px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  #login-gate h2{ margin:0 0 4px; font-size:19px; }
  #login-gate .sub{ color:var(--ink-muted); font-size:13px; margin:0 0 18px; line-height:1.6; }
  #login-gate .field{ margin-bottom:12px; }
  #login-gate label{ display:block; font-size:12.5px; color:var(--ink-2); margin-bottom:5px; font-weight:600; }
  #login-gate input{ width:100%; padding:10px 12px; border:1px solid var(--grid); border-radius:var(--radius-sm); background:var(--page); color:var(--ink); font:inherit; }
  #login-gate button{ width:100%; padding:11px; border:0; border-radius:var(--radius-sm); background:var(--primary); color:var(--primary-ink); font-weight:700; font-size:14.5px; cursor:pointer; margin-top:4px; }
  #login-gate button:disabled{ opacity:.6; cursor:not-allowed; }
  #login-gate .err{ color:var(--critical); font-size:12.5px; margin-top:10px; min-height:16px; }
  #login-gate .hint{ font-size:11.5px; color:var(--ink-muted); margin-top:14px; line-height:1.7; border-top:1px dashed var(--grid); padding-top:12px; }
  #app.is-hidden, #login-gate.is-hidden{ display:none; }
  .logout-btn{ background:none; border:1px solid var(--border); color:var(--ink-muted); font-size:11.5px; border-radius:999px; padding:4px 10px; cursor:pointer; margin-inline-start:8px; }
</style>

<div id="login-gate" dir="rtl" class="is-hidden">
  <h2>💰 صندوق المال</h2>
  <p class="sub">سجّل دخولك بالإيميل وكلمة السر عشان توصل لبياناتك من أي جهاز (جوال أو لابتوب).</p>
  <form id="login-form">
    <div class="field">
      <label for="login-email">الإيميل</label>
      <input id="login-email" type="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="login-password">كلمة السر</label>
      <input id="login-password" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" id="login-submit">دخول</button>
    <div class="err" id="login-error"></div>
  </form>
  <div class="hint">لازم يكون عندك مستخدم متسجّل مسبقًا بمشروع Firebase (Authentication &gt; Users) بنفس الإيميل وكلمة السر.</div>
</div>

<div id="app" dir="rtl" class="is-hidden">
  <header class="top">
    <h1>💰 صندوق المال</h1>
    <div class="sub">دخلك يتوزع تلقائيًا على صناديقك — يعمل على كل أجهزتك · <span id="app-version">Firebase</span> <button class="logout-btn" id="logout-btn" type="button">خروج</button></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="page"></main>
</div>
<div class="toast" id="toast"></div>

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  var firebaseConfig = {
  "apiKey": "AIzaSyAfI3uQaRKpRRbEn-CmqZdWr6ndoC0fLqM",
  "authDomain": "monay-app.firebaseapp.com",
  "projectId": "monay-app",
  "storageBucket": "monay-app.firebasestorage.app",
  "messagingSenderId": "200489878499",
  "appId": "1:200489878499:web:71bcd257131e11267516d6"
};
  var fbApp = initializeApp(firebaseConfig);
  var fbAuth = getAuth(fbApp);
  var fbDb = getFirestore(fbApp);

  // Snapshot of what was in the Claude-hosted version at the moment this
  // standalone copy was generated -- written once to Firestore, only if the
  // document doesn't exist yet (i.e. only on this file's very first run),
  // so the move to Firebase doesn't lose anything.
  var SEED_STATE = {
  "_seq": 0,
  "debts": {
    "iOwe": [],
    "owedToMe": []
  },
  "distLog": [],
  "fundConvert": {
    "emergency": [],
    "luxury": [],
    "stocks": []
  },
  "fundTx": {
    "emergency": [],
    "luxury": [],
    "otherGoals": [],
    "stocks": []
  },
  "goldTransfers": [],
  "goldTx": {
    "buy": [],
    "convert": [],
    "sell": []
  },
  "income": [],
  "needs": [
    {
      "amount": 0,
      "checked": true,
      "id": "n-expense",
      "name": "مصروف"
    },
    {
      "amount": 0,
      "checked": true,
      "id": "n-transport",
      "name": "مواصلات"
    },
    {
      "amount": 0,
      "checked": true,
      "id": "n-3g",
      "name": "3G"
    },
    {
      "amount": 0,
      "checked": true,
      "id": "n-haircut",
      "name": "حلاقة"
    },
    {
      "amount": 0,
      "checked": true,
      "id": "n-club",
      "name": "نادي"
    },
    {
      "amount": 0,
      "checked": true,
      "id": "n-easylife",
      "name": "ايزي لايف"
    },
    {
      "amount": 0,
      "checked": true,
      "id": "n-home",
      "name": "الدار"
    }
  ],
  "pending": null,
  "stockTx": {
    "buy": []
  },
  "subGoals": {
    "luxury": [],
    "otherGoals": []
  }
};

  function wrapSnap(snap){
    // Normalizes a real Firestore DocumentSnapshot (exists() and data() are
    // METHODS) into the shape the app below already expects (exists as a
    // boolean property, data as something snapData() can call either way).
    return { exists: snap.exists(), data: function(){ return snap.data(); }, metadata: snap.metadata };
  }

  function makeDb(){
    return {
      doc: function(path){
        var ref = doc(fbDb, path);
        return {
          get: async function(){
            var snap = await getDoc(ref);
            if(!snap.exists()){
              var seeded = Object.assign({}, SEED_STATE, { updatedAt: Date.now() });
              await setDoc(ref, seeded);
              return { exists: true, data: function(){ return seeded; }, metadata: { hasPendingWrites:false } };
            }
            return wrapSnap(snap);
          },
          set: function(data){ return setDoc(ref, data); },
          onSnapshot: function(cb){ return onSnapshot(ref, function(snap){ cb(wrapSnap(snap)); }); }
        };
      }
    };
  }

  // The app code below (unchanged from the Claude-hosted version) talks to
  // `window.claude.use("db")` -- so instead of touching any of that
  // already-tested logic, we just answer that same call ourselves, backed by
  // Firebase instead. `use("db")` doesn't resolve until a real signed-in user
  // (email/password) is present, so the app's own `await` on it naturally
  // waits for auth to be ready before it ever touches Firestore.
  //
  // Unlike the earlier anonymous-auth version, nobody is signed in
  // automatically: a login gate (below) collects email + password and calls
  // signInWithEmailAndPassword, so the app -- and the Firestore data behind
  // it -- is only reachable by someone with those credentials, even if this
  // page itself is hosted at a public URL.
  var resolveReady, rejectReady;
  var firebaseReady = new Promise(function(resolve, reject){ resolveReady = resolve; rejectReady = reject; });

  var loginGate = document.getElementById("login-gate");
  var appRoot = document.getElementById("app");
  var loginForm = document.getElementById("login-form");
  var loginEmail = document.getElementById("login-email");
  var loginPassword = document.getElementById("login-password");
  var loginError = document.getElementById("login-error");
  var loginSubmit = document.getElementById("login-submit");
  var logoutBtn = document.getElementById("logout-btn");

  setPersistence(fbAuth, browserLocalPersistence).catch(function(err){ console.error("Firebase persistence setup failed", err); });

  onAuthStateChanged(fbAuth, function(user){
    if(user){
      loginGate.classList.add("is-hidden");
      appRoot.classList.remove("is-hidden");
      resolveReady();
    } else {
      appRoot.classList.add("is-hidden");
      loginGate.classList.remove("is-hidden");
    }
  });

  var AUTH_ERROR_MESSAGES = {
    "auth/invalid-email": "صيغة الإيميل مش صحيحة.",
    "auth/user-not-found": "ما في حساب بهالإيميل. تأكد إنك ضفته من Firebase Console.",
    "auth/wrong-password": "كلمة السر غلط.",
    "auth/invalid-credential": "الإيميل أو كلمة السر غلط.",
    "auth/too-many-requests": "محاولات كتير غلط -- جرب بعد شوي.",
    "auth/network-request-failed": "صار خطأ بالاتصال بالإنترنت."
  };

  loginForm.addEventListener("submit", function(e){
    e.preventDefault();
    loginError.textContent = "";
    loginSubmit.disabled = true;
    loginSubmit.textContent = "جاري الدخول...";
    signInWithEmailAndPassword(fbAuth, loginEmail.value.trim(), loginPassword.value)
      .catch(function(err){
        loginError.textContent = AUTH_ERROR_MESSAGES[err.code] || ("صار خطأ: " + (err.code || err.message));
      })
      .finally(function(){
        loginSubmit.disabled = false;
        loginSubmit.textContent = "دخول";
      });
  });

  logoutBtn.addEventListener("click", function(){
    signOut(fbAuth);
  });

  window.claude = {
    use: function(name){
      if(name !== "db") return Promise.resolve(null);
      return firebaseReady.then(function(){ return makeDb(); }, function(){ return null; });
    }
  };

(function(){
  "use strict";

  // Temporary diagnostic: catch ANY uncaught exception (from a click handler,
  // render, etc.) and surface it directly in the persistent debug line. We've
  // seen clicks that visibly reach our own click-dispatch code (data-act is
  // logged) but never produce a toast afterward — which can only mean the
  // action function threw partway through, before reaching its toast() call.
  // Without this, that exception is invisible (no devtools access to the
  // user's phone) — this makes it show up in a screenshot instead.
  window.addEventListener('error', function(e){
    var d = document.getElementById('debug-line');
    if(d) d.textContent = '⚠️ خطأ برمجي: ' + (e.message||'') + ' — ' + (e.filename||'').split('/').pop() + ':' + (e.lineno||'') + ':' + (e.colno||'');
  });
  window.addEventListener('unhandledrejection', function(e){
    var d = document.getElementById('debug-line');
    if(d) d.textContent = '⚠️ خطأ برمجي (promise): ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
  });

  // ---------- constants ----------
  var CATS = {
    emergency:  { name:"صندوق الطوارئ",       icon:"🛟", varc:"--cat-emergency" },
    otherGoals: { name:"أهداف أخرى",          icon:"🎯", varc:"--cat-goals" },
    stocks:     { name:"أسهم",                icon:"📈", varc:"--cat-stocks" },
    gold:       { name:"ذهب",                 icon:"🪙", varc:"--cat-gold" },
    luxury:     { name:"صندوق الرفاهية",       icon:"✨", varc:"--cat-luxury" },

  function toWesternDigits(s){

  // One-time best-effort migration: the gold "sell" form used to be aggregate

  // exact buy it closes via boughtId). For any OLD sell entry recorded before
  // this change (no boughtId yet), try to match it to an unsold buy with the
  // same type/karat/weight so historical holdings still net out correctly.
  function migrateGoldLots(d){
    var buys = d.goldTx.buy.slice().sort(function(a,b){ return (a.seq||0)-(b.seq||0); });
    var used = {};
    d.goldTx.sell.forEach(function(s){
      if(s.boughtId){ used[s.boughtId] = true; return; }
      var match = buys.filter(function(b){
        return !used[b.id] && b.type===s.type && b.karat===s.karat && b.weight===s.weight;
      })[0];
      if(match){ s.boughtId = match.id; used[match.id] = true; }

  function migrate(data){
    var d = defaultState();

    // The db capability's snapshot data can come back non-extensible (frozen/
    // sealed) — it's a read-only view of the stored doc, not meant to be
    // mutated in place. Everything below assigns pieces of `data` straight
    // into our live `state` (e.g. d.income = data.income), so without this
    // clone, the FIRST time app code does state.income.push(...) (or any
    // other array from a snapshot), it throws "Cannot add property N, object
    // is not extensible" — silently, since it happens deep inside an action
    // function after persist()/render() but before that function's own
    // toast() call. A plain JSON round-trip gives us a fresh, fully mutable,
    // plain-object copy, completely decoupled from whatever the platform
    // handed us.
    try{ data = JSON.parse(JSON.stringify(data)); }catch(e){ /* fall through with original data if it somehow isn't serializable */ }

    d.fundTx = data.fundTx || d.fundTx;

    ["emergency","stocks","luxury"].forEach(function(k){ if(!Array.isArray(d.fundConvert[k])) d.fundConvert[k] = []; });

    d.goldTx = data.goldTx || d.goldTx;

  // Temporary diagnostic counters — not app data, just for hunting the

  function saveToDb(){
    if(!docRef) return;

    saveToDb();
  }

  // ---------- derived getters ----------
  function fundRawILS(key){
    var tx = (state.fundTx[key]||[]).reduce(function(s,t){ return s + (t.type==="withdraw" ? -t.amount : t.amount); }, 0);
    var transferredOut = state.goldTransfers.filter(function(g){ return g.fromFund===key; }).reduce(function(s,g){ return s+g.amount; }, 0);
    var convertedOut = (state.fundConvert[key]||[]).reduce(function(s,c){ return s+c.amountILS; }, 0);
    return tx - transferredOut - convertedOut;
  }
  // Finds the original buy lot a sell entry closed, if any.
  function lotForSell(sellEntry){
    return state.goldTx.buy.filter(function(b){ return b.id===sellEntry.boughtId; })[0];
  }
  function fundUSD(key){
    var fromConvert = (state.fundConvert[key]||[]).reduce(function(s,c){ return s+c.usd; }, 0);
    var boughtFromFund = state.goldTx.buy.filter(function(b){ return b.fundedBy===key; }).reduce(function(s,b){ return s+b.priceUSD; }, 0);
    var soldFromFund = state.goldTx.sell.filter(function(s){ var lot = lotForSell(s); return lot && lot.fundedBy===key; }).reduce(function(s,e){ return s+e.priceUSD; }, 0);
    var stockSpent = key==="stocks" ? state.stockTx.buy.reduce(function(s,t){ return s+t.amount; }, 0) : 0;
    return fromConvert - boughtFromFund + soldFromFund - stockSpent;
  }
  function goalSaved(goal){
    return goal.entries.reduce(function(s,e){ return s + (e.type==="withdraw" ? -e.amount : e.amount); }, 0);
  }
  function goalConvertedOutILS(goal){
    return (goal.convert||[]).reduce(function(s,c){ return s+c.amountILS; }, 0);
  }
  // How much of a goal's saved money is still sitting as ₪ (not yet converted to $).
  function goalAvailableILS(goal){

  }
  // This goal's own $ balance: what it converted, minus gold bought against it.

    var bought = state.goldTx.buy.filter(function(b){ return b.fundedByGoal===goal.id; }).reduce(function(s,b){ return s+b.priceUSD; }, 0);
    var sold = state.goldTx.sell.filter(function(s){ var lot = lotForSell(s); return lot && lot.fundedByGoal===goal.id; }).reduce(function(s,e){ return s+e.priceUSD; }, 0);
    return fromConvert - bought + sold;
  }

    return (state.subGoals[key]||[]).reduce(function(s,g){ return s+goalConvertedOutILS(g); }, 0);
  }
  function subGoalsTotal(key){
    return (state.subGoals[key]||[]).reduce(function(s,g){ return s+goalSaved(g); }, 0);
  }

    return fundRawILS(key) - subGoalsTotal(key);

  function fundAssetILS(key){

  function fundUSDDisplay(key){
    if(GOAL_KEYS.indexOf(key)>=0){

      var legacy = USD_FUNDS.indexOf(key)>=0 ? fundUSD(key) : 0;
      return goalsSum + legacy;
    }

  }
  function goldILSBalance(){
    var fromDist = state.distLog.filter(function(e){ return e.category==="gold"; }).reduce(function(s,e){ return s+e.amount; }, 0);
    var fromTransfers = state.goldTransfers.reduce(function(s,g){ return s+g.amount; }, 0);
    var converted = state.goldTx.convert.reduce(function(s,e){ return s+e.amountILS; }, 0);
    return fromDist + fromTransfers - converted;
  }

  // gold bought via a specific fund/goal's own $ credits that fund/goal instead

  function goldUSDBalance(){
    var fromConvert = state.goldTx.convert.reduce(function(s,e){ return s+e.usd; }, 0);
    var bought = state.goldTx.buy.filter(function(b){ return !b.fundedBy && !b.fundedByGoal; }).reduce(function(s,e){ return s+e.priceUSD; }, 0);
    var sold = state.goldTx.sell.filter(function(s){ var lot = lotForSell(s); return !lot || (!lot.fundedBy && !lot.fundedByGoal); }).reduce(function(s,e){ return s+e.priceUSD; }, 0);

  // Gold lots not yet referenced by any sell — these are what's actually held.
  function unsoldBuys(){

  // Aggregated summary (weight + avg $/₪ per type) of a set of held lots.
  // Defaults to everything unsold; pass a filtered list to scope it (e.g. to
  // one fund's own gold).
  function goldHoldingsSummary(lots){
    lots = lots || unsoldBuys();
    var map = {};
    lots.forEach(function(b){
      if(!map[b.type]) map[b.type] = {type:b.type, weight:0, count:0, usdTotal:0, ilsTotal:0, ilsCount:0};

  // Renders a "holdings summary" card (weight + avg $/₪ per type + grand total)
  // for a given set of lots. Used both by the Gold page (all holdings) and by
  // fund pages that buy their own gold directly (scoped to that fund's lots).
  function goldSummaryCard(lots, title){
    var summary = goldHoldingsSummary(lots);
    var grandWeight = summary.reduce(function(s,m){ return s+m.weight; }, 0);

        '<tr><td style="font-weight:800;">الإجمالي (كل الأنواع كمصاري)</td><td style="font-weight:800;">'+fmt(grandWeight)+'</td><td></td><td style="font-weight:800;">'+fmt(grandUSD,"$")+'</td><td style="font-weight:800;">'+(grandILS?fmt(grandILS,"₪"):"—")+'</td></tr>' +

  // Debt entries can each be recorded in their own currency (a loan handed
  // over in cash dollars vs. one in dinars vs. the app's own ₪ flow) — so
  // balances/totals for debts are kept PER CURRENCY (an object like
  // {"دولار":500,"دينار":200}), never summed across currencies into one
  // number, since 1 دولار isn't 1 دينار and the app has no exchange rate
  // between them. Legacy entries recorded before this feature existed have
  // no .currency field — they default to "شيكل" (₪), which is what they
  // actually were: plain app-currency amounts.
  var DEBT_CURRENCIES = ["دولار","دينار","شيكل"];
  function entryCurrency(e){ return e.currency || "شيكل"; }
  function personBalance(p){
    return p.entries.reduce(function(s,e){ return s + (e.type==="repay" ? -e.amount : e.amount); }, 0);
  }
  function personBalanceByCurrency(p){
    var out = {};
    p.entries.forEach(function(e){
      var cur = entryCurrency(e);
      var delta = e.type==="repay" ? -e.amount : e.amount;
      out[cur] = (out[cur]||0) + delta;
    });
    return out;
  }
  function addCurrencyMaps(a, b){
    var out = {};
    Object.keys(a).forEach(function(k){ out[k] = (out[k]||0) + a[k]; });
    Object.keys(b).forEach(function(k){ out[k] = (out[k]||0) + b[k]; });
    return out;
  }
  // Renders a per-currency amount map as e.g. "500 دولار، 200 دينار" —
  // dropping zero/near-zero entries; "0" when nothing's left outstanding.
  function fmtByCurrency(map, opts){
    opts = opts || {};
    var parts = DEBT_CURRENCIES.concat(Object.keys(map).filter(function(k){ return DEBT_CURRENCIES.indexOf(k)===-1; }))
      .filter(function(k){ return Math.abs(map[k]||0) > 0.005; })
      .map(function(k){ return fmt(opts.abs ? Math.abs(map[k]) : map[k]) + " " + k; });

  function debtTotal(listKey){
    return (state.debts[listKey]||[]).reduce(function(s,p){ return s + personBalance(p); }, 0);

    return (state.debts[listKey]||[]).reduce(function(s,p){ return addCurrencyMaps(s, personBalanceByCurrency(p)); }, {});

  function debtGrossLent(listKey){
    return (state.debts[listKey]||[]).reduce(function(s,p){

  function debtGrossLentByCurrency(listKey){
    return (state.debts[listKey]||[]).reduce(function(s,p){

      p.entries.filter(function(e){ return e.type==="lend"; }).forEach(function(e){
        var cur = entryCurrency(e);

  function findPerson(listKey, name){

  // ---------- income / distribution actions ----------
  function addIncome(){
    var date = $("#inc-date").value || todayStr();
    var source = $("#inc-source").value.trim();
    var amount = num($("#inc-amount").value);
    var currency = $("#inc-currency").value;
    var repayPerson = ($("#inc-repay-person") ? $("#inc-repay-person").value.trim() : "");
    if(amount <= 0){ toast("أدخل مبلغًا صحيحًا"); return; }
    var needsTotal = state.needs.filter(function(n){ return n.checked; }).reduce(function(s,n){ return s+num(n.amount); }, 0);
    var remaining = amount - needsTotal;
    var incEntry = {id:uid(), seq:nextSeq(), date:date, source:source||"—", amount:amount, currency:currency, needsDeducted:needsTotal};
    if(repayPerson){
      var per = findOrCreatePerson("owedToMe", repayPerson);
      // This repayment is literally the income amount that was just entered,
      // so it carries the SAME currency the person picked for that income
      // (شيكل/دولار) — no separate currency UI needed here.
      var repayEntry = {id:uid(), seq:nextSeq(), date:date, amount:amount, type:"repay", note:"سداد ضمن إضافة دخل", currency:currency};
      per.entries.push(repayEntry);
      incEntry.repayPerson = repayPerson;
      incEntry.repayEntryId = repayEntry.id;
    }
    state.income.push(incEntry);
    clearField("inc-source"); clearField("inc-amount");
    if($("#inc-repay-person")) clearField("inc-repay-person");
    // If there's already an undistributed amount sitting from a previous income
    // entry, add this one on top of it instead of overwriting it — nothing
    // should get lost until the user actually sends a distribution.
    if(state.pending){
      state.pending.incomeAmount += amount;
      state.pending.needsTotal += needsTotal;
      state.pending.remaining += remaining;
    } else {
      var alloc = {}; DIST_CAT_ORDER.forEach(function(k){ alloc[k]=0; });
      state.pending = { incomeAmount:amount, needsTotal:needsTotal, remaining:remaining, alloc:alloc, owedToMePerson:"", iOwePerson:"" };
    }
    persist();
    toast(repayPerson ? "تمت الإضافة وتسجيل السداد من "+repayPerson+" — المتبقي الآن "+fmt(state.pending.remaining,"₪")+" جاهز للتوزيع تحت"
                       : "تمت إضافة الدخل — المتبقي الآن "+fmt(state.pending.remaining,"₪")+" جاهز للتوزيع تحت");
  }
  function undoIncome(){
    if(!state.income.length) return;
    var last = state.income.pop();
    if(last.repayPerson && last.repayEntryId){
      var per = findPerson("owedToMe", last.repayPerson);
      if(per) per.entries = per.entries.filter(function(e){ return e.id!==last.repayEntryId; });
    }
    // Only unwind this entry's own contribution to the undistributed pool —
    // an earlier income entry that hasn't been distributed yet should stay.
    if(state.pending){
      var deducted = last.needsDeducted||0;
      state.pending.incomeAmount -= last.amount;
      state.pending.needsTotal -= deducted;
      state.pending.remaining -= (last.amount - deducted);
      if(state.pending.incomeAmount <= 0.01 && state.pending.needsTotal <= 0.01 && Math.abs(state.pending.remaining) <= 0.01){
        state.pending = null;
      }
    }
    persist();
  }

  function sendDistribution(){
    var p = state.pending; if(!p) return;
    var alloc = {};
    DIST_CAT_ORDER.forEach(function(k){ alloc[k] = num($("#alloc-"+k) ? $("#alloc-"+k).value : 0); });
    var total = DIST_CAT_ORDER.reduce(function(s,k){ return s+alloc[k]; }, 0);
    if(total <= 0){ toast("وزّع مبلغًا أولاً"); return; }
    if(total > p.remaining + 0.01){ toast("مجموع التوزيع أكبر من المتبقي"); return; }
    var iOwePerson = ($("#alloc-person-iOwe") ? $("#alloc-person-iOwe").value.trim() : "");
    if(alloc.iOwe > 0 && !iOwePerson){ toast("اكتب اسم الشخص لخانة ⁦سداد دين علي⁩"); return; }
    var sendId = uid(), date = todayStr();
    DIST_CAT_ORDER.forEach(function(key){
      var val = alloc[key]; if(val<=0) return;
      state.distLog.push({id:uid(), seq:nextSeq(), sendId:sendId, date:date, category:key, amount:val,
        person: key==="iOwe" ? iOwePerson : undefined});
      if(key==="gold"){ /* balance derived from distLog */ }
      else if(key==="iOwe"){
        var per = findOrCreatePerson("iOwe", iOwePerson);
        // Money allocated here comes straight out of the ₪ distribution pool,
        // so this repayment is recorded in شيكل regardless of what currency
        // this person's other debt entries happen to be in.
        per.entries.push({id:uid(), seq:nextSeq(), sendId:sendId, date:date, amount:val, type:"repay", note:"سداد من الصفحة الرئيسية", currency:"شيكل"});
      } else {
        state.fundTx[key].push({id:uid(), seq:nextSeq(), sendId:sendId, date:date, amount:val, type:"deposit", note:"من الصفحة الرئيسية"});
      }
    });
    // Only clear the pending distribution once its whole remaining balance
    // has actually been sent somewhere. This used to null state.pending
    // unconditionally right here — so a PARTIAL distribution (total less
    // than p.remaining) silently discarded whatever wasn't allocated this
    // round: not credited to any fund, not shown anywhere, just gone. Now
    // the leftover stays pending so "الخطوة ٣" keeps showing it and it can
    // be distributed later (in one or more further rounds) instead of
    // vanishing.
    p.remaining -= total;
    if(p.remaining <= 0.01){
      state.pending = null;
      persist();
      toast("تم التوزيع");
    } else {
      p.iOwePerson = "";
      persist();
      toast("تم توزيع "+fmt(total,"₪")+" — تبقى "+fmt(p.remaining,"₪")+" لسا محتاج توزيع تحت");
    }
  }
  function undoSend(){
    if(!state.distLog.length) return;
    var last = state.distLog[state.distLog.length-1];
    var sendId = last.sendId;
    var entries = state.distLog.filter(function(e){ return e.sendId===sendId; });
    state.distLog = state.distLog.filter(function(e){ return e.sendId!==sendId; });
    SIMPLE_FUNDS.forEach(function(k){ state.fundTx[k] = state.fundTx[k].filter(function(e){ return e.sendId!==sendId; }); });
    ["owedToMe","iOwe"].forEach(function(listKey){
      state.debts[listKey].forEach(function(p){ p.entries = p.entries.filter(function(e){ return e.sendId!==sendId; }); });
    });
    var alloc = {}; CAT_ORDER.forEach(function(k){ alloc[k]=0; });
    var owedToMePerson = "", iOwePerson = "";
    entries.forEach(function(e){
      alloc[e.category] = e.amount;
      if(e.category==="owedToMe") owedToMePerson = e.person||"";
      if(e.category==="iOwe") iOwePerson = e.person||"";
    });
    var remaining = entries.reduce(function(s,e){ return s+e.amount; }, 0);
    state.pending = {incomeAmount:remaining, needsTotal:0, remaining:remaining, alloc:alloc, owedToMePerson:owedToMePerson, iOwePerson:iOwePerson};
    persist();
  }

  function drawDoughnut(canvas, segments){
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var size = canvas.clientWidth;
    canvas.width = size*dpr; canvas.height = size*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,size,size);
    var cx=size/2, cy=size/2, rOuter=size/2-6, rInner=rOuter*0.62;
    var total = segments.reduce(function(s,x){ return s+x.value; }, 0);
    if(total<=0){
      ctx.beginPath(); ctx.arc(cx,cy,rOuter,0,Math.PI*2); ctx.fillStyle = cssVar("--surface-2"); ctx.fill();
      ctx.fillStyle = cssVar("--ink-muted"); ctx.font = "13px Tajawal, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("لا يوجد رصيد بعد", cx, cy);
      return;
    }
    var start = -Math.PI/2, gap = 0.018;
    segments.forEach(function(seg){
      if(seg.value<=0) return;
      var frac = seg.value/total;
      var end = start + frac*Math.PI*2;
      var a0 = start+gap/2, a1 = end-gap/2;
      if(a1<a0) a1=a0;
      ctx.beginPath();
      ctx.arc(cx,cy,rOuter,a0,a1);
      ctx.arc(cx,cy,rInner,a1,a0,true);
      ctx.closePath();
      ctx.fillStyle = seg.color;
      ctx.fill();
      start = end;
    });
    ctx.fillStyle = cssVar("--ink");
    ctx.font = "900 18px Tajawal, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(fmt(total), cx, cy-8);
    ctx.fillStyle = cssVar("--ink-muted");
    ctx.font = "11px Tajawal, sans-serif";
    ctx.fillText("إجمالي الأصول (₪)", cx, cy+14);
  }

  // Whatever the user is actively typing into right now — an income amount,
  // a distribution box, a needs field, anything — is not part of `state` until
  // its own change/blur handler commits it. If ANY unrelated action elsewhere
  // on the page triggers a full re-render in the meantime (adding another item,
  // a background sync landing, etc.), rebuilding #page's innerHTML would throw
  // that in-progress value away even though the user never touched that field.
  // Capturing the focused field before rebuilding and putting it right back
  // after closes that whole class of "I typed it and it vanished" bug, no
  // matter what triggers the re-render.
  // A field also just loses focus the instant the user clicks a BUTTON — the
  // browser blurs it before the click handler ever runs — so by the time
  // render() checks document.activeElement it's already the button, not the
  // field the user was just typing in. Tracking the most recently blurred
  // field (via a page-wide focusout listener, registered further down) lets
  // us fall back to "whatever was just being edited" in that case too.
  var lastBlurred = null;
  function captureFocus(){
    var el = document.activeElement;
    if(el && el.id && (el.tagName==="INPUT" || el.tagName==="TEXTAREA" || el.tagName==="SELECT")){
      var snap = { id: el.id, value: el.value };
      if(typeof el.selectionStart === "number"){ snap.selStart = el.selectionStart; snap.selEnd = el.selectionEnd; }
      return snap;
    }
    if(lastBlurred && (Date.now() - lastBlurred.t) < 1000) return lastBlurred;
    return null;
  }
  function restoreFocus(snap){
    if(!snap) return;
    var el = document.getElementById(snap.id);
    if(!el) return;
    el.value = snap.value;
    el.focus();
    if(typeof snap.selStart === "number" && el.setSelectionRange){
      try{ el.setSelectionRange(snap.selStart, snap.selEnd); }catch(e){}
    }
  }
  // Used by an action right after it successfully reads and commits a field's
  // value, so a stale "this field was just blurred by the click" snapshot
  // doesn't get restored on top of the deliberate clearing below.
  function clearField(id){
    var el = $("#"+id);
    if(el) el.value = "";
    if(lastBlurred && lastBlurred.id === id) lastBlurred = null;
  }
  function render(){
    if(!state) return;
    __diag.renders++;
    var focusSnap = captureFocus();
    renderTabs();
    if(ui.page==="home") pageHome();
    else if(SIMPLE_FUNDS.indexOf(ui.page)>=0) pageFund(ui.page);
    else if(ui.page==="owedToMe" || ui.page==="iOwe") pageDebt(ui.page);
    else if(ui.page==="gold") pageGold();
    restoreFocus(focusSnap);
  }
  document.addEventListener("focusout", function(e){
    var el = e.target;
    if(el && el.id && (el.tagName==="INPUT" || el.tagName==="TEXTAREA" || el.tagName==="SELECT")){
      var snap = { id: el.id, value: el.value, t: Date.now() };
      if(typeof el.selectionStart === "number"){ snap.selStart = el.selectionStart; snap.selEnd = el.selectionEnd; }
      lastBlurred = snap;
    }
  });

  // ---------- events ----------
  document.addEventListener("click", function(e){
    var tabBtn = e.target.closest("button[data-page]");
    if(tabBtn){ ui.page = tabBtn.getAttribute("data-page"); window.scrollTo({top:0}); render(); return; }

    var actEl = e.target.closest("[data-act]");
    if(actEl){
      var act = actEl.getAttribute("data-act");
      var key = actEl.getAttribute("data-key");
      var goalId = actEl.getAttribute("data-goal");
      // Temporary, persistent (non-fading) marker so it's possible to confirm
      // from a screenshot, taken any time after the click, that the click was
      // actually received here at all — independent of whatever the specific
      // action function does afterward (success, validation toast, or a bug).
      var dbg = document.getElementById("debug-line");
      if(dbg) dbg.textContent = "آخر ضغطة: " + act +
        " | pending الآن: " + (state.pending ? "موجود" : "فاضي") +
        " | renders:" + __diag.renders + " boots:" + __diag.boots +
        " | snapshots مطبّقة:" + __diag.snapApplied + " متجاهَلة(كتابة):" + __diag.snapSkippedPW + " متجاهَلة(قديمة):" + __diag.snapSkippedStale +
        " | أول تحميل فيه pending: " + (__diag.lastGetHadPending===null?"؟":(__diag.lastGetHadPending?"نعم":"لا")) +
        " | آخر تحديث فيه pending: " + (__diag.lastSnapHadPending===null?"؟":(__diag.lastSnapHadPending?"نعم":"لا"));
      try{
        if(act==="add-income") addIncome();
        else if(act==="undo-income") undoIncome();
        else if(act==="add-need") addNeedItem();
        else if(act==="send") sendDistribution();
        else if(act==="undo-send") undoSend();
        else if(act==="fund-deposit") fundTransact(key,"deposit");
        else if(act==="fund-withdraw") fundTransact(key,"withdraw");
        else if(act==="fund-undo") undoFundLast(key);
        else if(act==="fund-usd-convert") fundConvertToUSD(key);
        else if(act==="fund-usd-undo") undoFundConvert(key);
        else if(act==="goal-add") addSubGoal(key);
        else if(act==="goal-remove") removeGoal(key, goalId);
        else if(act==="goal-deposit") goalTransact(key, goalId, "deposit");
        else if(act==="goal-withdraw") goalTransact(key, goalId, "withdraw");
        else if(act==="goal-undo") undoGoalLast(key, goalId);
        else if(act==="goal-usd-convert") goalConvertToUSD(key, goalId);
        else if(act==="goal-usd-undo") undoGoalConvert(key, goalId);
        else if(act==="goal-gold-buy") goalGoldBuy(key, goalId);
        else if(act==="goal-gold-buy-undo") undoGoalGoldBuy(key, goalId);
        else if(act==="debt-inc") debtRegister(key, key==="owedToMe" ? "lend" : "borrow");
        else if(act==="debt-dec") debtRegister(key, "repay");
        else if(act==="debt-undo") undoDebtLast(key);
        else if(act==="gold-convert") goldConvert();
        else if(act==="gold-undo") undoGold(key);
        else if(act==="gold-trade") goldTrade(key);
        else if(act==="gold-sell") goldSell();
        else if(act==="fund-gold-buy") fundGoldBuy(key);
        else if(act==="fund-gold-buy-undo") undoFundGoldBuy(key);
        else if(act==="fund-gold-sell") fundGoldSell(key);
        else if(act==="fund-gold-sell-undo") undoFundGoldSell(key);
        else if(act==="stock-buy") stockBuy();
        else if(act==="stock-buy-undo") undoStockBuy();
        else if(act==="debt-delete-person"){
          var pid = actEl.getAttribute("data-person");
          var pk2 = key+"|"+pid;
          if(ui.confirmDeletePerson[pk2]){
            removeDebtPerson(key, pid);
          } else {
            ui.confirmDeletePerson[pk2] = true;
            render();
          }
        }
        else if(act==="debt-pick-name"){
          // Just fills the name field from an existing person and moves on to
          // the amount -- no state change, so no render() here (a re-render
          // would wipe whatever the person already typed into the amount/note
          // fields before picking the name).
          var nameInput = document.getElementById("debt-name-"+key);
          if(nameInput) nameInput.value = actEl.getAttribute("data-name");
          var amountInput = document.getElementById("debt-amount-"+key);
          if(amountInput) amountInput.focus();
        }
        else if(act==="log-toggle"){
          // Pure display toggle — not part of state, so a plain render() only
          // (no persist/saveToDb): it never writes to Firestore and can't
          // touch or lose any stored data.
          var logId = actEl.getAttribute("data-log");
          ui.expandedLogs[logId] = !ui.expandedLogs[logId];
          render();
        }
      }catch(err){
        // Belt-and-suspenders alongside the window "error" listener above: this
        // catches it right at the source, with the specific action name, even
        // in an environment where the global handler might not fire.
        if(dbg) dbg.textContent = "⚠️ خطأ أثناء تنفيذ " + act + ": " + (err && err.message ? err.message : String(err));
        console.error("action failed:", act, err);
      }
      return;
    }

    var needRemove = e.target.closest("[data-need-remove]");
    if(needRemove){ removeNeedItem(needRemove.getAttribute("data-need-remove")); return; }

    var personToggle = e.target.closest("[data-toggle-person]");
    if(personToggle && !e.target.closest("[data-act]")){
      var k = personToggle.getAttribute("data-toggle-person");
      ui.openPerson[k] = !ui.openPerson[k];
      delete ui.confirmDeletePerson[k]; // closing/reopening always starts unarmed
      render();
      return;
    }
  });

  document.addEventListener("change", function(e){
    var t = e.target;
    if(t.matches("[data-need-check]")) updateNeed(t.getAttribute("data-need-check"), "checked", t.checked);
    else if(t.matches("[data-need-amount]")) updateNeed(t.getAttribute("data-need-amount"), "amount", t.value);
    else if(t.matches("[data-need-name]")) updateNeed(t.getAttribute("data-need-name"), "name", t.value);
  });

  window.__moneyApp = { allocInput: updateAllocSummary };

  // ---------- boot ----------
  // Shown ONLY until the real saved data has loaded — the page must never let
  // the user type into an interactive form that is still showing a temporary
  // defaultState(), because the async DB fetch resolving afterwards would then
  // overwrite (state = migrate(snap.data)) whatever they just typed, wiping it
  // silently. This is what caused "typed a number / unchecked a box and it
  // reverted" — the fetch was racing the user's very first tap on the page.
  function renderLoading(){
    renderTabs();
    $("#page").innerHTML = '<div class="card"><div class="empty">جاري تحميل بياناتك…</div></div>';
  }

  // A DocumentSnapshot's body is read via snap.data() — a METHOD, not a plain
  // property — per this artifact's db contract. Reading snap.data (no call)
  // silently hands migrate() the function itself, which fails its typeof-object
  // check and resets everything to blank defaults; that reset then renders,
  // wiping the screen moments after every save (this was the real cause behind
  // "types fine but reverts the second I move on", the missing distribution
  // step after adding income, and the missing undo buttons — not a typing bug
  // at all). Handled defensively here in case a future/older runtime ever
  // serves `data` as a plain object instead.
  function snapData(snap){
    if(!snap) return undefined;
    var d = snap.data;
    return (typeof d === "function") ? d.call(snap) : d;
  }

  async function boot(){
    __diag.boots++;
    state = defaultState();
    renderLoading();
    try{
      if(window.claude && window.claude.use){
        db = await window.claude.use("db");
        if(db){
          docRef = db.doc("finance/state");
          var snap = await docRef.get();
          if(snap && snap.exists){ state = migrate(snapData(snap)); lastWrittenAt = state.updatedAt||0; }
          else { state = migrate(null); lastWrittenAt = state.updatedAt||0; await docRef.set(state); }
          __diag.lastGetHadPending = !!state.pending;
          render();
          docRef.onSnapshot(function(snap){
            if(snap && snap.exists){
              // A snapshot carrying our own not-yet-confirmed write is never real
              // remote data to apply — it's an echo. This is the officially
              // documented way to detect that (SnapshotMetadata.hasPendingWrites),
              // and it doesn't depend on comparing clocks/timestamps at all, so it
              // catches self-echoes even if updatedAt math ever lines up wrong.
              if(snap.metadata && snap.metadata.hasPendingWrites){ __diag.snapSkippedPW++; return; }
              var incoming = snapData(snap) || {};
              // Belt-and-suspenders: also ignore snapshots that are just the server
              // confirming a write we already applied locally — applying them again
              // would re-render and wipe any unsaved input the user is mid-typing
              // into a field that isn't part of `state` yet (like the income amount
              // box, or a distribution allocation box).
              if(incoming.updatedAt && incoming.updatedAt <= lastWrittenAt){ __diag.snapSkippedStale++; return; }
              __diag.snapApplied++;
              __diag.lastSnapHadPending = !!incoming.pending;
              state = migrate(incoming);
              lastWrittenAt = state.updatedAt||lastWrittenAt;
              render();
            }
          });
          return;
        }
      }
    }catch(err){ console.error("db init failed", err); }
    // No db available (or it failed) — nothing will overwrite us later, so it's
    // safe to show the interactive page with whatever state we have now.
    render();
  }
  boot();
})();
</script>
